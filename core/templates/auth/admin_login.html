<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login - AI Proctoring</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            color: white;
        }
        .login-card {
            background: white;
            color: #333;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">AI Proctoring</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm">Home</a>
    </div>
</nav>

<!-- Login Section -->
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="col-md-4">

        <div class="login-card p-4">

            <h4 class="text-center mb-4">Administrator Login</h4>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Enter admin username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-danger w-100">
                    Login as Admin
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Default: admin / admin</small>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center mt-4 mb-2">
    <small>Secure Admin Access • AI Exam Proctoring</small>
</footer>

</body>
</html>
