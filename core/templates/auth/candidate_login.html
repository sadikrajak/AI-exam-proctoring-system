<!DOCTYPE html>
<html lang="en">
<head>
    <title>Candidate Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
        }
        .card-box {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">AI Proctoring</a>
    <div class="ms-auto">
        <a href="/register/" class="btn btn-outline-light btn-sm">Register</a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">
    <div class="col-md-4">

        <div class="card p-4 card-box">

            <h4 class="text-center mb-3">Candidate Login</h4>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Enter your username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Login
                </button>
            </form>

            <div class="text-center mt-3">
                <small>New user?
                    <a href="/register/">Create an account</a>
                </small>
            </div>

        </div>
    </div>
</div>

<footer class="text-center mt-4 text-white-50">
    <small>Secure candidate access for online exams</small>
</footer>

</body>
</html>
