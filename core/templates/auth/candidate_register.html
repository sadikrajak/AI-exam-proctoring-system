<!DOCTYPE html>
<html lang="en">
<head>
    <title>Candidate Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
        }
        .card-box {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        video, canvas {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">AI Proctoring</a>
    <div class="ms-auto">
        <a href="/login/" class="btn btn-outline-light btn-sm">Candidate Login</a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:90vh;">
    <div class="col-md-5">

        <div class="card p-4 card-box">

            <h4 class="text-center mb-3">Candidate Registration</h4>

            <form method="post">
                {% csrf_token %}

                <input type="text" name="full_name" class="form-control mb-2"
                       placeholder="Full Name" required>

                <input type="email" name="email" class="form-control mb-2"
                       placeholder="Email Address" required>

                <input type="text" name="username" class="form-control mb-2"
                       placeholder="Username" required>

                <input type="password" name="password" class="form-control mb-3"
                       placeholder="Password" required>

                <label class="form-label">Capture Your Face</label>
                <video id="video" autoplay></video>

                <button type="button" class="btn btn-secondary w-100 mt-2"
                        onclick="capturePhoto()">Capture Photo</button>

                <!-- hidden field to send image -->
                <input type="hidden" name="photo_data" id="photo_data">

                <!-- hidden canvas -->
                <canvas id="canvas" style="display:none;"></canvas>

                <button type="submit" class="btn btn-success w-100 mt-3">
                    Register
                </button>
            </form>

        </div>
    </div>
</div>

<script>
const video = document.getElementById('video');

navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(() => {
        alert("Webcam access is required for registration.");
    });

function capturePhoto() {
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    const imageData = canvas.toDataURL('image/jpeg');
    document.getElementById('photo_data').value = imageData;

    alert("Photo captured successfully!");
}
</script>

</body>
</html>
