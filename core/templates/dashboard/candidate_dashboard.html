<!DOCTYPE html>
<html lang="en">
<head>
    <title>Candidate Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card-box {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">AI Proctoring</a>
    <div class="ms-auto">
        <a href="/candidate_logout/" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">

    <!-- Welcome -->
    <div class="card p-4 mb-4 card-box">
        <h4>Welcome, {{ user.username }} 👋</h4>
        <p class="mb-0 text-muted">
            You can view and start your available online exams below.
        </p>
    </div>

    <!-- Actions -->
    <div class="row">

        <div class="col-md-6 mb-3">
            <div class="card p-4 text-center card-box">
                <h5>Available Exams</h5>
                <p class="text-muted">See exams that are currently active</p>
                <a href="/candidate/exams/" class="btn btn-primary">
                    View Exams
                </a>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card p-4 text-center card-box">
                <h5>Exam Instructions</h5>
                <p class="text-muted">Ensure webcam and mic are enabled</p>
                <button class="btn btn-secondary" disabled>
                    Read Instructions
                </button>
            </div>
        </div>

    </div>

</div>

<footer class="text-center mt-4 mb-3 text-muted">
    <small>All exams are monitored by AI-based proctoring</small>
</footer>

</body>
</html>
