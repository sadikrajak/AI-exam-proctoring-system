<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Questions</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card-box {
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/admin_dashboard/">Admin Dashboard</a>
    <div class="ms-auto">
        <a href="/admin_dashboard/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a href="/admin_logout/" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Exam title -->
    <div class="card p-3 mb-4 card-box">
        <h4 class="mb-0">Add Questions for: {{ exam.title }}</h4>
    </div>

    <!-- Add question form -->
    <div class="card p-3 mb-4 card-box">
        <h5>Add New Question</h5>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Question Text</label>
                <textarea name="text" class="form-control" rows="3"
                          placeholder="Enter the question here" required></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Add Question
            </button>
        </form>
    </div>

    <!-- Existing questions list -->
    <div class="card p-3 card-box">
        <h5>Existing Questions</h5>

        <table class="table table-bordered table-hover mt-3">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Question</th>
                </tr>
            </thead>
            <tbody>
            {% for q in questions %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ q.text }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2" class="text-center text-muted">
                        No questions added yet
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<footer class="text-center mt-4 mb-3 text-muted">
    <small>You can add multiple questions for this exam</small>
</footer>

</body>
</html>
